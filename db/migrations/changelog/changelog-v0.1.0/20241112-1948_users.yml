databaseChangeLog:
- changeSet:
    id: 20241112-1948_users
    author: spontan
    changes:
    - createTable:
        schemaName: woc
        tableName: user
        columns:
          - column:
              name: user_id
              type: BIGINT
              constraints:
                nullable: false
                primaryKey: true
                unique: true
          - columns:
              name: username
              type: VARCHAR(255)
              constraints:
                nullable: false
          - column:
              name: email
              type: VARCHAR(255)
              constraints:
                nullable: false                
          - column:
              name: password
              type: VARCHAR(MAX)
              constraints:
                nullable: false
          - column:
              name: created_date
              type: DATETIME
              constraints:
                nullable: false
          - column:
              name: modified_date
              type: DATETIME
    - createSequence:
        schemaName: woc
        sequenceName: user_seq
        startValue: 1
        
    - addColumn:
        schemaName: woc
        tableName: workout_set
        columns:
          - column:
              name: user_id
              type: BIGINT
              constraints:
                nullable: false
                foreignKeyName: user_id
