spring.application.name=workoutoclock

woc.security.jwt.secret-key=${API_JWT_SECRET_KEY}
woc.security.jwt.duration=3600

spring.jpa.database=postgresql
spring.jpa.properties.hibernate.default_schema=woc 
spring.datasource.url=jdbc:postgresql://${API_DB_HOST}:5432/${DB_NAME}
spring.datasource.username=app
spring.datasource.password=${DB_APP_PASSWORD}

spring.devtools.restart.log-condition-evaluation-delta=false
spring.jpa.hibernate.ddl-auto=validate

